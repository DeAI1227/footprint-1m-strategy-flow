[project]
name = "orderflow"
version = "0.0.0"
description = "Sentence layer for the footprint 1m system. Hot path stays in Rust."
requires-python = ">=3.12"
readme = "README.md"

[project.scripts]
orderflow = "orderflow.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["orderflow*"]
