[workspace]
resolver = "2"
members = [
    "crates/orderflow-domain",
    "crates/orderflow-clock",
    "crates/orderflow-ingest",
    "crates/orderflow-book",
    "crates/orderflow-footprint",
    "crates/orderflow-exec",
    "crates/orderflow-py",
    "crates/orderflowd",
]
default-members = [
    "crates/orderflow-domain",
    "crates/orderflow-clock",
    "crates/orderflow-ingest",
    "crates/orderflow-book",
    "crates/orderflow-footprint",
    "crates/orderflow-exec",
    "crates/orderflowd",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.0.0"
publish = false
rust-version = "1.85"

[workspace.dependencies]
orderflow-domain = { path = "crates/orderflow-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
pyo3 = { version = "0.23", default-features = false, features = ["macros"] }
