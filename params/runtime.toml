# Runtime / venues / live gate. No secrets, no API keys.
# School: footprint only. Execution venue is OKX. Resonance computed, mode off.

school = "footprint"
mode_default = "shadow"
execution_venue = "okx"
resonance = "off"
# k_of_n peer count. Recorded even while mode stays off. Not a live switch.
resonance_k = 1

[calibration]
# 21-day observation draft is not out-of-sample validation.
# observation_frozen freezes DEFINITIONS (day 21). It is not calibration_complete.
status = "observation_draft"
observation_frozen = true
live_authorized = false
out_of_sample_validated = false
calibration_complete = false

[risk]
# Shared SOL/SUI beta cap. Numbers are observation placeholders, not live authorization.
shared_beta_cap_enabled = false
risk_pct = 0.002
symbol_cap_notional = 1000.0
account_cap_notional = 2000.0
leverage_cap = 3.0
daily_loss_halt = 50.0
liq_buffer_pct = 0.05
max_day_trades = 20
equity = 10000.0
kill_switch_clear_on_start = false
reconcile_every_s = 30

[exec]
# Double lock: live_send stays false. Calibration gate is the other lock.
# No API keys in this file.
td_mode = "cross"
pos_mode = "net_mode"
live_send = false
entry_ttl_ms = 15000
max_amend = 2
max_slippage_ticks = 4

[ops]
# Tokyo run placeholders. Not live authorization. No secrets.
crash_window_s = 120
crash_burst = 5
clear_crash_on_start = false
log_max_bytes = 104857600
log_keep = 7
disk_min_free_bytes = 1073741824
hot_journal_days = 3

[venues.okx]
role = "execution"
public_ws = "wss://ws.okx.com:8443/ws/v5/public"
private_ws = "wss://ws.okx.com:8443/ws/v5/private"
rest = "https://www.okx.com"

[venues.binance]
role = "resonance"
public_ws = "wss://fstream.binance.com/ws"
rest = "https://fapi.binance.com"

[venues.bybit]
role = "resonance"
public_ws = "wss://stream.bybit.com/v5/public/linear"
rest = "https://api.bybit.com"
