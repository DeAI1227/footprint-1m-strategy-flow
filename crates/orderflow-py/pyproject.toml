[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "orderflow-native"
version = "0.0.0"
requires-python = ">=3.12"
description = "PyO3 live-gate and dummy frozen snapshot. Not a market-data parser."

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "orderflow_native"
features = ["extension-module"]
